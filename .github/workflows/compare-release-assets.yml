name: Compare Release Assets

on:
  workflow_dispatch:
    inputs:
      base_tag:
        description: 'Base release tag to compare against (default: latest release)'
        required: false
        type: string
      ci_run_id:
        description: 'CI Run ID to download artifacts from (optional)'
        required: false
        type: string
      wheels_run_id:
        description: 'Build Wheels Run ID to download artifacts from (optional)'
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  compare:
    name: Compare artifacts vs release
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0

      - name: Resolve inputs
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          CI_RUN_ID="${{ inputs.ci_run_id }}"
          WHEELS_RUN_ID="${{ inputs.wheels_run_id }}"
          BASE_TAG_INPUT="${{ inputs.base_tag }}"

          if [[ -z "$CI_RUN_ID" || -z "$WHEELS_RUN_ID" ]]; then
            echo "::error::Provide both ci_run_id and wheels_run_id"
            exit 1
          fi

          if [[ -z "$BASE_TAG_INPUT" ]]; then
            BASE_TAG=$(gh release view --json tagName --jq '.tagName')
          else
            BASE_TAG="$BASE_TAG_INPUT"
          fi

          echo "base_tag=$BASE_TAG" >> "$GITHUB_OUTPUT"
          echo "ci_run_id=$CI_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "wheels_run_id=$WHEELS_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Validate run IDs match base tag commit
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          BASE_TAG="${{ steps.resolve.outputs.base_tag }}"
          CI_RUN_ID="${{ steps.resolve.outputs.ci_run_id }}"
          WHEELS_RUN_ID="${{ steps.resolve.outputs.wheels_run_id }}"

          git fetch --tags --force origin
          TAG_SHA=$(git rev-list -n 1 "$BASE_TAG")

          CI_SHA=$(gh run view "$CI_RUN_ID" --json headSha --jq '.headSha')
          WHEELS_SHA=$(gh run view "$WHEELS_RUN_ID" --json headSha --jq '.headSha')

          echo "Base tag: $BASE_TAG"
          echo "Tag commit: $TAG_SHA"
          echo "CI run: $CI_RUN_ID (headSha=$CI_SHA)"
          echo "Build Wheels run: $WHEELS_RUN_ID (headSha=$WHEELS_SHA)"

          if [[ -z "$CI_SHA" || -z "$WHEELS_SHA" ]]; then
            echo "::error::Failed to resolve headSha from the provided run IDs"
            exit 1
          fi
          if [[ "$CI_SHA" != "$WHEELS_SHA" ]]; then
            echo "::error::ci_run_id and wheels_run_id are from different commits. Provide run IDs from the same commit."
            exit 1
          fi
          if [[ "$CI_SHA" != "$TAG_SHA" ]]; then
            echo "::error::Run IDs do not match the base tag commit. Select CI/Build Wheels runs for $BASE_TAG (commit $TAG_SHA)."
            exit 1
          fi

          echo "commit_sha=$CI_SHA" >> "$GITHUB_OUTPUT"

      - name: Download base release assets
        shell: bash
        run: |
          set -euo pipefail
          BASE_TAG="${{ steps.resolve.outputs.base_tag }}"
          echo "Base tag: $BASE_TAG"
          mkdir -p base_release
          gh release download "$BASE_TAG" --dir base_release

      - name: Stage baseline packages (release-intended only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p base_packages/python base_packages/ruby

          # Core source archive
          while IFS= read -r f; do
            cp "$f" base_packages/
          done < <(find base_release -type f -name "archive_r-core-*.tar.gz" | sort || true)

          # Python sdist (exclude core tarball)
          while IFS= read -r f; do
            cp "$f" base_packages/python/
          done < <(
            find base_release -type f -name "*.tar.gz" ! -name "archive_r-core-*.tar.gz" \
              | sort || true
          )

          # Official wheels
          while IFS= read -r f; do
            cp "$f" base_packages/python/
          done < <(
            find base_release -type f -name "*.whl" \
              | grep -E "(manylinux|macos|macosx|universal2|win_amd64)" \
              | sort || true
          )

          # Ruby gem
          while IFS= read -r f; do
            cp "$f" base_packages/ruby/
          done < <(find base_release -type f -name "*.gem" | sort || true)

          echo "Baseline staged packages:" && ls -R base_packages

      - name: Download new artifacts (CI)
        shell: bash
        run: |
          set -euo pipefail
          CI_RUN_ID="${{ steps.resolve.outputs.ci_run_id }}"
          mkdir -p new_artifacts
          gh run download "$CI_RUN_ID" --dir new_artifacts

      - name: Download new artifacts (Build Wheels)
        shell: bash
        run: |
          set -euo pipefail
          WHEELS_RUN_ID="${{ steps.resolve.outputs.wheels_run_id }}"
          mkdir -p new_artifacts
          gh run download "$WHEELS_RUN_ID" --dir new_artifacts

      - name: Stage candidate packages (release-intended only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p new_packages/python new_packages/ruby

          # Core source archive
          while IFS= read -r f; do
            cp "$f" new_packages/
          done < <(find new_artifacts -type f -name "archive_r-core-*.tar.gz" | sort || true)

          # Python sdist (exclude core tarball)
          while IFS= read -r f; do
            cp "$f" new_packages/python/
          done < <(
            find new_artifacts -type f -name "*.tar.gz" ! -name "archive_r-core-*.tar.gz" \
              | sort || true
          )

          # Official wheels
          while IFS= read -r f; do
            cp "$f" new_packages/python/
          done < <(
            find new_artifacts -type f -name "*.whl" \
              | grep -E "(manylinux|macos|macosx|universal2|win_amd64)" \
              | sort || true
          )

          # Ruby gem
          while IFS= read -r f; do
            cp "$f" new_packages/ruby/
          done < <(find new_artifacts -type f -name "*.gem" | sort || true)

          echo "Candidate staged packages:" && ls -R new_packages

      - name: Compare assets (content-based, metadata ignored)
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/compare_release_assets.py \
            --base-dir base_packages \
            --new-dir new_packages \
            --base-tag "${{ steps.resolve.outputs.base_tag }}" \
            --commit-sha "${{ steps.validate.outputs.commit_sha }}" \
            --out-json compare_report.json \
            --out-md compare_report.md
          cat compare_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload comparison report
        if: ${{ always() && env.ACT != 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: compare-release-assets-${{ steps.validate.outputs.commit_sha }}
          path: |
            compare_report.json
            compare_report.md
          if-no-files-found: error
          retention-days: 30
