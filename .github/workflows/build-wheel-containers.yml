name: Build Wheel Containers

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-manylinux-aarch64-base:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      LIBARCHIVE_VERSION: 3.8.7
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Lowercase Registry Owner
        id: owner
        shell: bash
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push manylinux_2_28_aarch64 deps image
        run: |
          set -euo pipefail
          IMAGE_NAME="ghcr.io/${{ steps.owner.outputs.owner }}/archive_r/manylinux_2_28_aarch64_deps"
          docker buildx build \
            --platform linux/arm64 \
            --build-arg LIBARCHIVE_VERSION="${LIBARCHIVE_VERSION}" \
            -f .github/docker/manylinux-2-28-aarch64-deps.Dockerfile \
            -t "${IMAGE_NAME}:latest" \
            -t "${IMAGE_NAME}:${GITHUB_SHA}" \
            --push .
