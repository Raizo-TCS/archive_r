name: Sign & Attest Release Assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to sign/attest (e.g., v0.1.7)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  sign-and-attest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          mkdir -p release_assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release_assets
          echo "Downloaded assets:" && ls -la release_assets

      - name: Generate provenance attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            release_assets/*

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Sign assets (keyless) and upload signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          shopt -s nullglob

          for f in release_assets/*; do
            if [[ -f "$f" ]]; then
              echo "Signing $f"
              cosign sign-blob --yes --bundle "${f}.bundle" --output-signature "${f}.sig" --output-certificate "${f}.crt" "$f"
            fi
          done

          echo "Uploading signature artifacts to release $TAG"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" release_assets/*.sig release_assets/*.crt release_assets/*.bundle --clobber
